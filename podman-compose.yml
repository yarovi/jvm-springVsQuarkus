services:

  postgres:
    image: postgres:17-alpine
    container_name: quarkus-postgres

    environment:
      POSTGRES_DB: quarkusdb
      POSTGRES_USER: quarkus
      POSTGRES_PASSWORD: quarkus

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
